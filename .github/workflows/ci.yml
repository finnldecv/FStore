name: CI

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main, develop]

env:
  DOTNET_VERSION: "10.0.203"
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: List root files
        run: ls -la

      - name: Find all solutions
        run: find . -name "*.sln" -not -path "./node_modules/*"

      - name: Restore all projects
        run: |
          for proj in $(find . -name "*.csproj" -not -path "*/obj/*" -not -path "*/bin/*"); do
            echo "Restoring $proj"
            dotnet restore "$proj"
          done

      - name: Build all projects
        run: |
          for proj in $(find . -name "*.csproj" -not -path "*/obj/*" -not -path "*/bin/*"); do
            echo "Building $proj"
            dotnet build "$proj" --configuration Release --no-restore
          done

      - name: Run Catalog unit tests
        run: >
          dotnet test tests/FStore.Catalog.UnitTests/FStore.Catalog.UnitTests.csproj
          --no-build --configuration Release --verbosity normal

      - name: Run Basket unit tests
        run: >
          dotnet test tests/FStore.Basket.UnitTests/FStore.Basket.UnitTests.csproj
          --no-build --configuration Release --verbosity normal

      - name: Run Catalog integration tests
        run: >
          dotnet test tests/FStore.Catalog.IntegrationTests/FStore.Catalog.IntegrationTests.csproj
          --no-build --configuration Release --verbosity normal

      - name: Run Basket integration tests
        run: >
          dotnet test tests/FStore.Basket.IntegrationTests/FStore.Basket.IntegrationTests.csproj
          --no-build --configuration Release --verbosity normal

      - name: Run Order unit tests
        run: >
          dotnet test tests/FStore.Order.UnitTests/FStore.Order.UnitTests.csproj 
          --no-build --configuration Release --verbosity normal

      - name: Run Order integration tests
        run: >
          dotnet test tests/FStore.Order.IntegrationTests/FStore.Order.IntegrationTests.csproj 
          --no-build --configuration Release --verbosity normal
  docker:
    name: Build Docker Images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.ref == 'refs/heads/master'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Catalog API
        if: github.ref == 'refs/heads/master'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/Services/Catalog/FStore.Catalog.Api/Dockerfile
          push: true
          tags: |
            ghcr.io/finnldecv/fstore-catalog-api:${{ github.sha }}
            ghcr.io/finnldecv/fstore-catalog-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Basket API image
        if: github.ref == 'refs/heads/master'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/Services/Basket/FStore.Basket.Api/Dockerfile
          push: true
          tags: |
            ghcr.io/finnldecv/fstore-basket-api:${{ github.sha }}
            ghcr.io/finnldecv/fstore-basket-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Order API image
        if: github.ref == 'refs/heads/master'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/Services/Order/FStore.Order.Api/Dockerfile
          push: true
          tags: |
            ghcr.io/finnldecv/fstore-order-api:${{ github.sha }}
            ghcr.io/finnldecv/fstore-order-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Identity API image
        if: github.ref == 'refs/heads/master'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/Services/Identity/FStore.Identity.Api/Dockerfile
          push: true
          tags: |
            ghcr.io/finnldecv/fstore-identity-api:${{ github.sha }}
            ghcr.io/finnldecv/fstore-identity-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build ApiGateway image
        if: github.ref == 'refs/heads/master'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/Gateways/FStore.ApiGateway/Dockerfile
          push: true
          tags: |
            ghcr.io/finnldecv/fstore-apigateway:${{ github.sha }}
            ghcr.io/finnldecv/fstore-apigateway:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Frontend image
        if: github.ref == 'refs/heads/master'
        uses: docker/build-push-action@v6
        with:
          context: ./src/Apps/FStore.Web
          file: src/Apps/FStore.Web/Dockerfile
          push: true
          tags: |
            ghcr.io/finnldecv/fstore-web:${{ github.sha }}
            ghcr.io/finnldecv/fstore-web:latest
          build-args: |
            VITE_API_BASE_URL=http://localhost:5000
          cache-from: type=gha
          cache-to: type=gha,mode=max
