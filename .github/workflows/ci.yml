name: CI

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main, develop]

env:
  DOTNET_VERSION: "10.0.203"
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: List root files
        run: ls -la

      - name: Find all solutions
        run: find . -name "*.sln" -not -path "./node_modules/*"

      - name: Debug — list actual files
        run: |
          echo "=== src directory ==="
          ls -la src/
          echo "=== src/BuildingBlocks ==="
          ls -la src/BuildingBlocks/ || echo "MISSING"
          echo "=== All .csproj ==="
          find . -name "*.csproj" -not -path "*/obj/*" -not -path "*/bin/*"
          echo "=== .sln references ==="
          grep -i "BuildingBlocks" FStore.slnx

      - name: Debug — check exact paths
        run: |
          echo "=== Files in src/BuildingBlocks ==="
          ls -la src/BuildingBlocks/

          echo ""
          echo "=== Contents of FStore.Common folder ==="
          ls -la src/BuildingBlocks/FStore.Common/

          echo ""
          echo "=== Contents of FStore.EventBus folder ==="
          ls -la src/BuildingBlocks/FStore.EventBus/

          echo ""
          echo "=== .sln references (with quotes to show exactly) ==="
          grep -i "BuildingBlocks" FStore.sln

          echo ""
          echo "=== Test access with exact path from .sln ==="
          test -f src/BuildingBlocks/FStore.Common/FStore.Common.csproj && echo "FOUND" || echo "NOT FOUND"
          test -f src/BuildingBlocks/FStore.EventBus/FStore.EventBus.csproj && echo "FOUND" || echo "NOT FOUND"

      - name: Restore all projects
        run: |
          for proj in $(find . -name "*.csproj" -not -path "*/obj/*" -not -path "*/bin/*"); do
            echo "Restoring $proj"
            dotnet restore "$proj"
          done

      - name: Build all projects
        run: |
          for proj in $(find . -name "*.csproj" -not -path "*/obj/*" -not -path "*/bin/*"); do
            echo "Building $proj"
            dotnet build "$proj" --configuration Release --no-restore
          done

      - name: Run Catalog unit tests
        run: >
          dotnet test tests/FStore.Catalog.UnitTests/FStore.Catalog.UnitTests.csproj
          --no-build --configuration Release --verbosity normal

      - name: Run Basket unit tests
        run: >
          dotnet test tests/FStore.Basket.UnitTests/FStore.Basket.UnitTests.csproj
          --no-build --configuration Release --verbosity normal

      - name: Run Catalog integration tests
        run: >
          dotnet test tests/FStore.Catalog.IntegrationTests/FStore.Catalog.IntegrationTests.csproj
          --no-build --configuration Release --verbosity normal

      - name: Run Basket integration tests
        run: >
          dotnet test tests/FStore.Basket.IntegrationTests/FStore.Basket.IntegrationTests.csproj
          --no-build --configuration Release --verbosity normal
