name: CI

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main, develop]

env:
  DOTNET_VERSION: "10.0.203"
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: List root files
        run: ls -la

      - name: Find all solutions
        run: find . -name "*.sln" -not -path "./node_modules/*"

      - name: Restore all projects
        run: |
          for proj in $(find . -name "*.csproj" -not -path "*/obj/*" -not -path "*/bin/*"); do
            echo "Restoring $proj"
            dotnet restore "$proj"
          done

      - name: Build all projects
        run: |
          for proj in $(find . -name "*.csproj" -not -path "*/obj/*" -not -path "*/bin/*"); do
            echo "Building $proj"
            dotnet build "$proj" --configuration Release --no-restore
          done

      - name: Run Catalog unit tests
        run: >
          dotnet test tests/FStore.Catalog.UnitTests/FStore.Catalog.UnitTests.csproj
          --no-build --configuration Release --verbosity normal

      - name: Run Basket unit tests
        run: >
          dotnet test tests/FStore.Basket.UnitTests/FStore.Basket.UnitTests.csproj
          --no-build --configuration Release --verbosity normal

      - name: Run Catalog integration tests
        run: >
          dotnet test tests/FStore.Catalog.IntegrationTests/FStore.Catalog.IntegrationTests.csproj
          --no-build --configuration Release --verbosity normal

      - name: Run Basket integration tests
        run: >
          dotnet test tests/FStore.Basket.IntegrationTests/FStore.Basket.IntegrationTests.csproj
          --no-build --configuration Release --verbosity normal

      - name: Log in to GHCR
        if: github.ref == 'refs/heads/master'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Catalog API
        if: github.ref == 'refs/heads/master'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/Services/Catalog/FStore.Catalog.Api/Dockerfile
          push: true
          tags: ghcr.io/finnldecv/fstore-catalog-api:${{ github.sha }},ghcr.io/finnldecv/fstore-catalog-api:latest
