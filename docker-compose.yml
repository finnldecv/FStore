services:
  catalogdb:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "FStore_2026!"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - catalog_data:/var/opt/mssql
  basketdb:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - basket_data:/data

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports: 
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  catalog-api:
    build:
      context: .
      dockerfile: src/Services/Catalog/FStore.Catalog.Api/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings_CatalogDb=Server=catalogdb,1433;Database=FStore_Catalog:User Id=sa;Password=FStore_2026!;TrustServerCertificate=True;
      - ConnectionStrings_RabbitMq=rabbitmq://guest:guest@rabbitmq:5672
    depends_on:
      - catalogdb
      - rabbitmq
    ports:
      - "5001:8000"

  basket-api:
    build:
      context: .
      dockerfile: src/Services/Basket/FStore.Basket.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings_BasketDb: "basketdb:6379"
      ConnectionStrings_RabbitMq: "rabbitmq://guest:guest@rabbitmq:5672"
    ports:
      - "5002:8080"
    depends_on:
      - basketdb
      - rabbitmq

  apigateway:
    build:
      context: .
      dockerfile: src/Gateways/FStore.ApiGateway/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ReverseProxy__Clusters__catalog-cluster__Destinations__catalog-api__Address: "http://catalog-api:8080/"
      ReverseProxy__Clusters__basket-cluster__Destinations__basket-api__Address: "http://basket-api:8080/"
    ports:
      - "5000:8080"
    depends_on:
      - catalog-api
      - basket-api

volumes:
  catalog_data:
  basket_data:
  rabbitmq_data: