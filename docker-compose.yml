services:
  catalogdb:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "FStore_2026!"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - catalog_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'FStore_2026!' -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
  basketdb:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - basket_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports: 
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  catalog-api:
    build:
      context: .
      dockerfile: src/Services/Catalog/FStore.Catalog.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__CatalogDb: Server=catalogdb,1433;Database=FStore_Catalog;User Id=sa;Password=FStore_2026!;TrustServerCertificate=True;
      ConnectionStrings__RabbitMq: rabbitmq://guest:guest@rabbitmq:5672
    depends_on:
      - catalogdb
      - rabbitmq
    ports:
      - "5001:8080"

  basket-api:
    build:
      context: .
      dockerfile: src/Services/Basket/FStore.Basket.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings_BasketDb: "basketdb:6379"
      ConnectionStrings_RabbitMq: "rabbitmq://guest:guest@rabbitmq:5672"
    ports:
      - "5002:8080"
    depends_on:
      - basketdb
      - rabbitmq

  order-api:
    build:
      context: .
      dockerfile: src/Services/Order/FStore.Order.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__OrderDb: "Server=catalogdb,1433;Database=FStore_Order;User Id=sa;Password=FStore_2026!;TrustServerCertificate=True;"
      ConnectionStrings__RabbitMq: "rabbitmq://guest:guest@rabbitmq:5672"
    ports:
      - "5003:8080"
    depends_on:
      - catalogdb
      - rabbitmq

  apigateway:
    build:
      context: .
      dockerfile: src/Gateways/FStore.ApiGateway/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ReverseProxy__Clusters__catalog-cluster__Destinations__catalog-api__Address: "http://catalog-api:8080/"
      ReverseProxy__Clusters__basket-cluster__Destinations__basket-api__Address: "http://basket-api:8080/"
      ReverseProxy__Clusters__order-cluster__Destinations__order-api__Address: "http://order-api:8080/"
    ports:
      - "5000:8080"
    depends_on:
      - catalog-api
      - basket-api
      - order-api
  finnshop-web:
    build:
      context: ./src/Apps/FStore.Web
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:5000
    ports:
      - "5173:80"
    depends_on:
      - apigateway  

volumes:
  catalog_data:
  basket_data:
  rabbitmq_data: